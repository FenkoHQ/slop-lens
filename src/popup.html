<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Slop Lens</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="masthead">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <circle cx="10" cy="10" r="6" />
          <path d="M14.6 14.6 L20 20" stroke-linecap="round" />
        </svg>
      </span>
      <h1>Slop Lens</h1>
      <button
        type="button"
        id="open-settings"
        class="icon-btn"
        title="Settings"
        aria-label="Settings"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 8h8M18.5 8H20M4 16h2.5M13 16h7" />
          <circle cx="15" cy="8" r="2.4" />
          <circle cx="9.5" cy="16" r="2.4" />
        </svg>
      </button>
    </header>

    <main id="view">
      <p class="status" id="status">Reading page…</p>
    </main>

    <footer class="colophon">
      <span>slop-guard 0.5.0 rules, ported to JS</span>
      <button type="button" id="score-file" class="link">Score a file</button>
    </footer>

    <script src="settings.js"></script>
    <script src="indicator.js"></script>
    <script src="report.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
